name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew && ./gradlew :TMessagesProj_App:assembleAfatDebug -Pandroid.injected.build.abi=arm64-v8a --no-daemon
      - name: Find APK
        if: always()
        run: find . $HOME /tmp -name "*.apk" 2>/dev/null | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: aerogram-apk
          path: "**/*.apk"
          if-no-files-found: error
